plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.receiptocr'
version = '0.1.0'

android {
  namespace "expo.modules.receiptocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ML Kit Text Recognition v2, Latin script, model bundled in the APK (works offline, no Play download).
  // 16.0.1 = latest on dl.google.com/android/maven2 (checked 2026-11-05).
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
